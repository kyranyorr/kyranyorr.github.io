<!-- 🌗 Terapkan tema tersimpan sedini mungkin, supaya tidak "kedip" putih dulu sebelum jadi gelap -->
<script>
  (function(){
    try{
      var saved = localStorage.getItem('classdeck_theme_v1');
      var theme = (saved === 'light' || saved === 'dark')
        ? saved
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    }catch(e){}
  })();
</script>

/* helper: pastikan data lama (tanpa kas/komponen) tetap punya struktur baru */
function ensureDataShape(db){
  ['webdev','robotic'].forEach(cls=>{
    if(!db[cls]) return;
    if(!db[cls].kas) db[cls].kas = { transactions: [] };
    if(!db[cls].kas.transactions) db[cls].kas.transactions = [];
    if(!db[cls].komponen) db[cls].komponen = [];
  });
  return db;
}

/* ==================== 2b. AKUN & PERAN (login) ==================== */
function slugifyUsername(name){
  return (name||'')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\s]/g,'')
    .trim()
    .split(/\s+/)
    .join('.');
}

// akun bawaan non-customer, ditambah 1 akun customer otomatis per siswa yang ada
function buildDefaultAccounts(db){
  const accounts = [
    { id:'acc-owner',      username:'owner',     password:'owner123',      role:'owner',        displayName:'Owner Web' },
    { id:'acc-tangan',     username:'asisten',   password:'asisten123',    role:'tangan_kanan', displayName:'Tangan Kanan' },
    { id:'acc-bendahara',  username:'bendahara', password:'bendahara123',  role:'bendahara',    displayName:'Bendahara' },
    { id:'acc-wakil',      username:'wakil',     password:'wakil123',      role:'wakil_ketua',  displayName:'Wakil Ketua Kelas' },
  ];
  const used = new Set(accounts.map(a=>a.username));
  ['webdev','robotic'].forEach(cls=>{
    (db[cls].students||[]).forEach(s=>{
      let base = slugifyUsername(s.name) || 'siswa';
      let username = base, n = 2;
      while(used.has(username)){ username = `${base}${n}`; n++; }
      used.add(username);
      accounts.push({
        id: uid('acc'),
        username,
        password: 'siswa123',
        role: 'customer',
        studentId: s.id,
        studentClass: cls,
        displayName: s.name
      });
    });
  });
  return accounts;
}

function loadAccounts(){
  const raw = localStorage.getItem(ACCOUNTS_KEY);
  if(raw){
    try{ return JSON.parse(raw); }catch(e){ /* jatuh ke bawah, buat ulang */ }
  }
  const fresh = buildDefaultAccounts(loadData());
  localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(fresh));
  return fresh;
}
function saveAccounts(){ localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(ACCOUNTS)); }

function loadSession(){
  try{ return JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){ return null; }
}
function logout(){
  localStorage.removeItem(SESSION_KEY);
  window.location.href = 'index.html';
}

function loadData(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw){
    const fresh = buildDefaultData();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
    return fresh;
  }
  try{
    return ensureDataShape(JSON.parse(raw));
  }catch(e){
    console.error('Data localStorage rusak, memuat data default.', e);
    const fresh = buildDefaultData();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
    return fresh;
  }
}

function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
}

/* 📅 bulan absensi yang terakhir dipilih -> otomatis diingat saat file dibuka lagi */
function loadSelectedMonth(){
  const raw = localStorage.getItem(MONTH_KEY);
  const n = Number(raw);
  if(n >= 1 && n <= 12) return n;
  return new Date().getMonth() + 1; // default: bulan berjalan
}
function saveSelectedMonth(){
  localStorage.setItem(MONTH_KEY, String(currentMonth));
}

/* 🌗 TEMA GELAP/TERANG — diingat otomatis lewat localStorage.
   Kalau belum pernah diatur, ikuti preferensi sistem/browser pengguna. */
function loadTheme(){
  const saved = localStorage.getItem(THEME_KEY);
  if(saved === 'light' || saved === 'dark') return saved;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function applyTheme(){
  document.documentElement.setAttribute('data-theme', currentTheme);
  const btn = document.getElementById('themeToggle');
  if(btn){
    btn.innerHTML = currentTheme === 'dark'
      ? '<i class="fa-solid fa-sun"></i>'
      : '<i class="fa-solid fa-moon"></i>';
    btn.title = currentTheme === 'dark' ? 'Pindah ke mode terang' : 'Pindah ke mode gelap';
  }
}

function toggleTheme(){
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, currentTheme);
  applyTheme();
  const custIcon = document.querySelector('#themeToggleCustomer i');
  if(custIcon) custIcon.className = currentTheme==='dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
  showToast(currentTheme === 'dark' ? '🌙 Mode gelap aktif' : '☀️ Mode terang aktif');
}

/* ==================== 4. UTIL ==================== */
function showToast(message, type='success'){
  const box = document.getElementById('toastBox');
  const colors = { success:'#0E9E8F', error:'#E5484D', info:'#3B82F6' };
  const el = document.createElement('div');
  el.className = 'toast card px-4 py-2.5 text-sm font-medium shadow-lg';
  el.style.borderLeft = `4px solid ${colors[type]||colors.success}`;
  el.textContent = message;
  box.appendChild(el);
  setTimeout(()=> el.remove(), 2500);
}

function classData(){ return DB[currentClass]; }
function meta(){ return CLASS_META[currentClass]; }

function calcTotal(g){
  if(!g) return 0;
  const { menulis=0, keaktifan=0, tugas=0, proyek=0 } = g;
  return Math.round((Number(menulis)+Number(keaktifan)+Number(tugas)+Number(proyek))/4);
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,9); }

function submitMyTask(){
  const found = findMyStudent();
  if(!found) return;
  const { student: s, cls } = found;
  const title = document.getElementById('myTaskTitle').value.trim();
  if(!title){ showToast('⚠️ Judul tugas wajib diisi.', 'error'); return; }
  const task = { id: uid('t'), title, date: new Date().toISOString().slice(0,10) };
  if(cls === 'robotic'){
    task.photoLink = document.getElementById('myTaskPhoto').value.trim();
    task.projectLink = document.getElementById('myTaskProject').value.trim();
  } else {
    task.link = document.getElementById('myTaskLink').value.trim();
  }
  s.tasks.unshift(task);
  saveData();
  showToast('✅ Tugas berhasil dikumpulkan.');
  renderCustomerPage();
}

function deleteMyTask(taskId){
  const found = findMyStudent();
  if(!found) return;
  if(!confirm('Hapus tugas ini?')) return;
  found.student.tasks = found.student.tasks.filter(t=>t.id!==taskId);
  saveData();
  showToast('🗑️ Tugas dihapus.');
  renderCustomerPage();
}

function changeMonth(month){
  currentMonth = Number(month);
  saveSelectedMonth();
  renderAbsensiPage();
  showToast(`📅 Bulan absensi diganti ke ${MONTH_NAMES[currentMonth-1]}.`);
}

function cycleAttendance(studentId, meetingNo){
  const data = classData();
  if(!data.attendance[studentId]) data.attendance[studentId] = {};
  if(!data.attendance[studentId][currentMonth]) data.attendance[studentId][currentMonth] = {};
  const monthData = data.attendance[studentId][currentMonth];
  const current = monthData[meetingNo] || '';
  const idx = STATUS_CYCLE.indexOf(current);
  const next = STATUS_CYCLE[(idx+1) % STATUS_CYCLE.length];
  if(next === ''){
    delete monthData[meetingNo];
  } else {
    monthData[meetingNo] = next;
  }
  saveData();
  renderAbsensiPage();
}

/* ==================== 8. RENDER: HALAMAN PENILAIAN & PODIUM ==================== */
function renderPenilaianPage(){
  const data = classData();
  const m = meta();

  // hitung total & urutkan untuk podium
  const ranked = data.students
    .map(s => ({ ...s, total: calcTotal(data.grades[s.id]) }))
    .sort((a,b)=> b.total - a.total);

  const top3 = ranked.slice(0,3);
  const [p1,p2,p3] = [top3[0], top3[1], top3[2]];

  function podiumBlock(student, place){
    if(!student) return `<div class="flex-1"></div>`;
    const heights  = { 1:'140px', 2:'105px', 3:'80px' };
    const colors   = { 1:'var(--gold)', 2:'var(--silver)', 3:'var(--bronze)' };
    const medals   = { 1:'🥇', 2:'🥈', 3:'🥉' };
    const order    = { 1:2, 2:1, 3:3 }; // urutan visual: 2-1-3
    return `
      <div class="flex-1 flex flex-col items-center" style="order:${order[place]}">
        <div class="w-11 h-11 rounded-full flex items-center justify-center font-display font-bold text-white mb-2"
             style="background:${colors[place]}">${escapeHtml(student.name).charAt(0).toUpperCase()}</div>
        <p class="text-xs font-semibold text-center mb-1 truncate w-full">${escapeHtml(student.name)}</p>
        <p class="text-[11px] text-[var(--text-muted)] mb-2">🌟 ${student.total} poin</p>
        <div class="podium-bar w-full" style="height:${heights[place]}; background:${colors[place]}">
          <span class="mb-2 text-lg">${medals[place]}</span>
        </div>
      </div>
    `;
  }

  const gradeRows = data.students.map(s=>{
    const g = data.grades[s.id] || {};
    const total = calcTotal(g);
    const inputs = GRADE_CRITERIA.map(c => `
      <td class="px-2 py-2 text-center">
        <input type="number" min="0" max="100" value="${g[c.key] ?? 0}"
               class="w-16 text-center rounded-md border px-1 py-1 text-sm"
               style="border-color:var(--border)"
               onchange="updateGrade('${s.id}','${c.key}', this.value)">
      </td>`).join('');
    return `
      <tr class="border-t" style="border-color:var(--border)">
        <td class="px-3 py-2 font-medium whitespace-nowrap">${escapeHtml(s.name)}</td>
        ${inputs}
        <td class="px-3 py-2 text-center font-display font-bold" style="color:${m.color}">${total}</td>
      </tr>
    `;
  }).join('') || `<tr><td class="px-3 py-4 text-sm text-[var(--text-muted)]">Belum ada siswa.</td></tr>`;

  document.getElementById('pageContent').innerHTML = `
    ${pageHeader('🏆 Penilaian & Leaderboard', `Podium otomatis berdasarkan total nilai 4 kriteria, kelas ${m.label}.`)}

    <div class="card p-6 mb-6">
      <div class="flex items-end justify-center gap-4 max-w-md mx-auto">
        ${podiumBlock(p1,1)}
        ${podiumBlock(p2,2)}
        ${podiumBlock(p3,3)}
      </div>
      ${ranked.length===0 ? `<p class="text-center text-sm text-[var(--text-muted)] mt-4">Belum ada data nilai untuk ditampilkan.</p>` : ''}
    </div>

    <div class="card overflow-x-auto">
      <table class="min-w-full text-sm">
        <thead>
          <tr class="border-b" style="border-color:var(--border)">
            <th class="px-3 py-2 text-left text-[11px] font-semibold text-[var(--text-muted)]">Nama Siswa</th>

function updateGrade(studentId, key, value){
  const data = classData();
  let v = Number(value);
  if(isNaN(v)) v = 0;
  v = Math.max(0, Math.min(100, v));
  if(!data.grades[studentId]) data.grades[studentId] = {};
  data.grades[studentId][key] = v;
  saveData();
  renderPenilaianPage();
}

function toggleAccStudentField(){
  const role = document.getElementById('newAccRole').value;
  document.getElementById('newAccStudent').classList.toggle('hidden', role !== 'customer');
}

function addAccount(){
  const username = document.getElementById('newAccUsername').value.trim();
  const password = document.getElementById('newAccPassword').value.trim();
  const role = document.getElementById('newAccRole').value;
  if(!username || !password){ showToast('⚠️ Username dan password wajib diisi.', 'error'); return; }
  if(ACCOUNTS.some(a=>a.username.toLowerCase()===username.toLowerCase())){
    showToast('⚠️ Username sudah dipakai.', 'error'); return;
  }
  const acc = { id: uid('acc'), username, password, role };
  if(role === 'customer'){
    const sel = document.getElementById('newAccStudent').value; // "cls::id"
    if(!sel){ showToast('⚠️ Pilih siswa untuk akun customer.', 'error'); return; }
    const [cls, sid] = sel.split('::');
    const student = DB[cls].students.find(s=>s.id===sid);
    acc.studentClass = cls;
    acc.studentId = sid;
    acc.displayName = student ? student.name : username;
  } else {
    acc.displayName = (ROLE_META[role]||{}).label || username;
  }
  ACCOUNTS.push(acc);
  saveAccounts();
  showToast('✅ Akun berhasil dibuat.');
  renderPengaturanPage();
}

function updateAccountField(id, field, value){
  const a = ACCOUNTS.find(x=>x.id===id);
  if(!a) return;
  a[field] = value;
  saveAccounts();
}

function deleteAccount(id){
  const a = ACCOUNTS.find(x=>x.id===id);
  if(!a) return;
  if(a.role==='owner' && ACCOUNTS.filter(x=>x.role==='owner').length<=1){
    showToast('⚠️ Minimal harus ada 1 akun owner.', 'error'); return;
  }
  if(!confirm(`Hapus akun "${a.username}"?`)) return;
  ACCOUNTS = ACCOUNTS.filter(x=>x.id!==id);
  saveAccounts();
  showToast('🗑️ Akun dihapus.');
  renderPengaturanPage();
}

function exportData(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `classdeck-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('✅ Data berhasil di-export.');
}

document.getElementById('importFileInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    try{
      const parsed = JSON.parse(evt.target.result);
      if(!parsed.webdev || !parsed.robotic){
        showToast('⚠️ Format file JSON tidak sesuai.', 'error');
        return;
      }
      DB = parsed;
      saveData();
      showToast('✅ Data berhasil di-import.');
      renderPage();
    }catch(err){
      console.error(err);
      showToast('❌ Gagal membaca file JSON.', 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = ''; // reset supaya bisa pilih file yang sama lagi
});

function resetData(){
  if(!confirm('Yakin ingin menghapus semua data dan kembali ke data contoh awal?')) return;
  DB = buildDefaultData();
  saveData();
  showToast('🔄 Data direset ke data awal.');
  renderPage();
}

          <p class="font-medium mb-1">${escapeHtml(t.title)}</p>
          <p class="text-xs text-[var(--text-muted)] mb-1">${t.date||''}</p>
          <a href="${escapeHtml(t.photoLink)}" target="_blank" class="text-xs block truncate hover:underline" style="color:${m.color}"><i class="fa-solid fa-image mr-1"></i>${escapeHtml(t.photoLink)||'(belum diisi)'}</a>
          <a href="${escapeHtml(t.projectLink)}" target="_blank" class="text-xs block truncate hover:underline" style="color:${m.color}"><i class="fa-solid fa-code-branch mr-1"></i>${escapeHtml(t.projectLink)||'(belum diisi)'}</a>
        </div>
      `;
    }
    return `
      <div class="border rounded-lg p-3 mb-2 text-sm" style="border-color:var(--border)">
        <p class="font-medium mb-1">${escapeHtml(t.title)}</p>
        <p class="text-xs text-[var(--text-muted)] mb-1">${t.date||''}</p>
        <a href="${escapeHtml(t.link)}" target="_blank" class="text-xs block truncate hover:underline" style="color:${m.color}"><i class="fa-solid fa-link mr-1"></i>${escapeHtml(t.link)||'(belum diisi)'}</a>
      </div>
    `;
  }).join('') : `<p class="text-xs text-[var(--text-muted)]">📭 Belum ada tugas dikumpulkan.</p>`;

  const taskFormHtml = currentClass === 'robotic' ? `
    <input id="newTaskTitle" placeholder="Judul tugas/proyek" class="w-full border rounded-lg px-3 py-2 text-sm mb-2" style="border-color:var(--border)">
    <input id="newTaskPhoto" placeholder="Link Foto/Dokumentasi" class="w-full border rounded-lg px-3 py-2 text-sm mb-2" style="border-color:var(--border)">
    <input id="newTaskProject" placeholder="Link File Project (Drive/Github/Docs)" class="w-full border rounded-lg px-3 py-2 text-sm mb-2" style="border-color:var(--border)">
  ` : `
    <input id="newTaskTitle" placeholder="Judul tugas/proyek" class="w-full border rounded-lg px-3 py-2 text-sm mb-2" style="border-color:var(--border)">
    <input id="newTaskLink" placeholder="Link Project" class="w-full border rounded-lg px-3 py-2 text-sm mb-2" style="border-color:var(--border)">
  `;

  document.getElementById('studentModalBody').innerHTML = `
    <div class="flex items-start justify-between mb-4">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-full flex items-center justify-center font-display font-bold text-white" style="background:${m.color}">
          ${escapeHtml(s.name).charAt(0).toUpperCase()}
        </div>
        <div>
          <p class="font-semibold">${escapeHtml(s.name)}</p>
          <p class="text-xs text-[var(--text-muted)]">${m.label}</p>
        </div>
      </div>
      <button onclick="closeModal('studentModal')" class="text-[var(--text-muted)] hover:opacity-70"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <p class="text-sm mb-4">${escapeHtml(s.bio) || '<span class="text-[var(--text-muted)]">😴 Belum ada bio.</span>'}</p>

    <div class="flex items-center justify-between mb-2">
      <p class="text-xs font-semibold uppercase tracking-wide text-[var(--text-muted)]">📂 Riwayat Tugas / Proyek</p>
      <div class="flex gap-2">
        <button onclick="openStudentForm('${s.id}')" class="text-xs" style="color:${m.color}"><i class="fa-solid fa-pen"></i> ✏️ Edit Profil</button>
        <button onclick="deleteStudent('${s.id}')" class="text-xs text-red-500"><i class="fa-solid fa-trash"></i> 🗑️ Hapus</button>
      </div>
    </div>
    <div class="max-h-40 overflow-y-auto mb-3">${taskListHtml}</div>

    <div class="border-t pt-3" style="border-color:var(--border)">
      <p class="text-xs font-semibold uppercase tracking-wide text-[var(--text-muted)] mb-2">➕ Tambah Tugas Baru</p>
      ${taskFormHtml}
      <button onclick="addTask('${s.id}')" class="px-4 py-2 rounded-lg text-sm font-semibold text-white w-full" style="background:${m.color}">
        <i class="fa-solid fa-plus mr-1"></i> 💾 Simpan Tugas
      </button>
    </div>
  `;

  openModal('studentModal');
}

function addTask(studentId){
  const data = classData();
  const s = data.students.find(x=>x.id===studentId);
  if(!s) return;
  const title = document.getElementById('newTaskTitle').value.trim();
  if(!title){ showToast('⚠️ Judul tugas wajib diisi.', 'error'); return; }

  const task = { id: uid('t'), title, date: new Date().toISOString().slice(0,10) };
  if(currentClass === 'robotic'){
    task.photoLink   = document.getElementById('newTaskPhoto').value.trim();
    task.projectLink = document.getElementById('newTaskProject').value.trim();
  } else {
    task.link = document.getElementById('newTaskLink').value.trim();
  }
  s.tasks.unshift(task);
  saveData();
  showToast('✅ Tugas berhasil ditambahkan.');
  openStudentModal(studentId); // refresh modal
  renderProfilPage();          // refresh jumlah tugas di kartu
}

function deleteStudent(studentId){
  if(!confirm('Hapus siswa ini beserta seluruh data absensi dan nilainya?')) return;
  const data = classData();
  data.students = data.students.filter(s=>s.id!==studentId);
  delete data.attendance[studentId];
  delete data.grades[studentId];
  saveData();
  // 🔐 hapus juga akun login customer milik siswa ini biar tidak jadi akun "hantu"
  const beforeLen = ACCOUNTS.length;
  ACCOUNTS = ACCOUNTS.filter(a=>!(a.role==='customer' && a.studentId===studentId));
  if(ACCOUNTS.length !== beforeLen) saveAccounts();
  closeModal('studentModal');
  showToast('🗑️ Siswa dihapus.');
  renderPage();
}

/* ==================== 11. MODAL: FORM TAMBAH/EDIT SISWA ==================== */
function openStudentForm(studentId){
  const data = classData();
  const m = meta();
  const editing = !!studentId;
  const s = editing ? data.students.find(x=>x.id===studentId) : null;

  document.getElementById('formModalBody').innerHTML = `
    <div class="flex items-center justify-between mb-4">
      <p class="font-semibold">${editing ? '✏️ Edit Siswa' : '➕ Tambah Siswa Baru'}</p>
      <button onclick="closeModal('formModal')" class="text-[var(--text-muted)] hover:opacity-70"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <label class="text-xs font-medium text-[var(--text-muted)]">Nama Lengkap</label>
    <input id="formName" value="${s ? escapeHtml(s.name) : ''}" class="w-full border rounded-lg px-3 py-2 text-sm mb-3 mt-1" style="border-color:var(--border)">
    <label class="text-xs font-medium text-[var(--text-muted)]">Bio Singkat</label>
    <textarea id="formBio" rows="3" class="w-full border rounded-lg px-3 py-2 text-sm mb-4 mt-1" style="border-color:var(--border)">${s ? escapeHtml(s.bio) : ''}</textarea>
    <button onclick="saveStudentForm(${editing ? `'${studentId}'` : 'null'})" class="px-4 py-2 rounded-lg text-sm font-semibold text-white w-full" style="background:${m.color}">
      <i class="fa-solid fa-floppy-disk mr-1"></i> 💾 Simpan
    </button>
  `;
  closeModal('studentModal');
  openModal('formModal');
}

function saveStudentForm(studentId){
  const data = classData();
  const name = document.getElementById('formName').value.trim();
  const bio  = document.getElementById('formBio').value.trim();
  if(!name){ showToast('⚠️ Nama wajib diisi.', 'error'); return; }

  if(studentId){
    const s = data.students.find(x=>x.id===studentId);
    s.name = name; s.bio = bio;
    // 🔄 nama bisa berubah, jadi sinkronkan juga nama tampilan di akun customer terkait (username tidak diubah biar tidak bikin siswa bingung login)
    const acc = ACCOUNTS.find(a=>a.role==='customer' && a.studentId===studentId);
    if(acc){ acc.displayName = name; saveAccounts(); }
  } else {
    const newId = uid('s');
    data.students.push({ id:newId, name, kelas: meta().label, bio, tasks: [] });
    // 🔐 otomatis buatkan akun login customer untuk siswa baru: username dari nama, password default siswa123
    const used = new Set(ACCOUNTS.map(a=>a.username.toLowerCase()));
    let base = slugifyUsername(name) || 'siswa';
    let username = base, n = 2;
    while(used.has(username.toLowerCase())){ username = `${base}${n}`; n++; }
    ACCOUNTS.push({
      id: uid('acc'),
      username,
      password: 'siswa123',
      role: 'customer',
      studentId: newId,
      studentClass: currentClass,
      displayName: name
    });
    saveAccounts();
    showToast(`🔑 Akun siswa dibuat: ${username} / siswa123`);
  }
  saveData();
  closeModal('formModal');
  showToast('✅ Data siswa disimpan.');
  renderPage();
}

/* ==================== util modal ==================== */
function openModal(id){
  const el = document.getElementById(id);
  el.classList.remove('hidden');
  el.classList.add('flex');
}
function closeModal(id){
  const el = document.getElementById(id);
  el.classList.add('hidden');
  el.classList.remove('flex');
}

/* ==================== 12. INIT ==================== */
function renderPage(){
  if(SESSION && !ALLOWED_PAGES.includes(currentPage)){
    currentPage = ALLOWED_PAGES[0] || 'profil';
  }
  renderSidebar();
  if(currentPage === 'profil')      renderProfilPage();
  else if(currentPage === 'absensi')   renderAbsensiPage();
  else if(currentPage === 'penilaian') renderPenilaianPage();
  else if(currentPage === 'kas')       renderKasPage();
  else if(currentPage === 'komponen')  renderKomponenPage();
  else if(currentPage === 'pengaturan') renderPengaturanPage();
}

document.getElementById('classSwitcher').addEventListener('click', (e)=>{
  const btn = e.target.closest('.class-btn');
  if(!btn) return;
  currentClass = btn.dataset.class;
  if(currentPage === 'pengaturan') currentPage = ALLOWED_PAGES.find(p=>p!=='pengaturan') || ALLOWED_PAGES[0]; // pengaturan bersifat global, sisanya per-kelas
  renderPage();
});

document.querySelectorAll('.menu-btn[data-page]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentPage = btn.dataset.page;
    renderPage();
  });
});

// klik area gelap di belakang modal untuk menutup
[['studentModal'],['formModal']].forEach(([id])=>{
  document.getElementById(id).addEventListener('click', (e)=>{
    if(e.target.id === id) closeModal(id);
  });
});

// terapkan tema tersimpan, lalu render sesuai peran (kalau ada sesi login)
if(SESSION){
  applyTheme();
  if(SESSION.role === 'customer'){
    document.querySelector('.flex.min-h-screen').classList.add('hidden');
    const cv = document.getElementById('customerView');
    cv.classList.remove('hidden');
    cv.classList.add('flex');
    renderCustomerPage();
  } else {
    applyRoleUI();
    renderPage();
  }
}
</script>
</body>
</html>
